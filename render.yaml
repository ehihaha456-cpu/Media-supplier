services:
  - type: web
    name: auto-media-delivery-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT app.web:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: auto_media_bot
      - key: OWNER_IDS
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DEFAULT_STORAGE_LIMIT
        value: "20"
      - key: DEFAULT_INTERVAL_MINUTES
        value: "60"
